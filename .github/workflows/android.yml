name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;29.0.13113456
            cmake;3.22.1
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK, instrumentation, unit tests, and lint
        run: ./android/gradlew --project-dir android :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./android/gradlew --project-dir android :app:connectedDebugAndroidTest --no-daemon
            mkdir -p android/app/build/reports/device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am startservice -n dev.lain.os/.runtime.RuntimeService > android/app/build/reports/device/foreign-service.txt 2>&1 || true
            grep -Eq 'Permission Denial|not exported' android/app/build/reports/device/foreign-service.txt
            adb shell am start -n dev.lain.os/.MainActivity
            sleep 2
            adb shell uiautomator dump /sdcard/lain-window.xml
            adb pull /sdcard/lain-window.xml android/app/build/reports/device/window.xml
            adb exec-out screencap -p > android/app/build/reports/device/screen.png
      - name: Upload APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-debug-and-reports
          path: |
            android/app/build/outputs/apk/
            android/app/build/outputs/androidTest-results/
            android/app/build/test-results/
            android/app/build/reports/
